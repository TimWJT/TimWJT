<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banner Editor</title>
<style>
:root {
  --paper:#f5f4ed; --ink:#282a24; --muted:#686a60; --line:#d4d5c8; --accent:#315cd5; --field:#fff;
  color-scheme:light;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
.ed-app { display:grid; grid-template-columns:1fr 340px; min-height:100vh; }
.ed-stage { padding:28px; display:flex; flex-direction:column; gap:14px; }
.ed-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.ed-bar .ed-spacer { flex:1; }
.ed-canvas { border-radius:14px; padding:24px; background:#fff; border:1px solid var(--line); }
.ed-canvas.is-dark { background:#0d1117; border-color:#0d1117; }
.ed-canvas svg { display:block; width:100%; height:auto; touch-action:none; }
.ed-canvas.is-editing [data-part] { cursor:grab; }
.ed-canvas.is-editing [data-part]:hover { opacity:.8; }
.ed-hint { color:var(--muted); margin:0; }
.ed-panel { border-left:1px solid var(--line); padding:18px; overflow:auto; max-height:100vh; }
.ed-panel h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
.ed-panel h2:first-child { margin-top:0; }
.ed-group { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; display:grid; gap:6px; }
.ed-row { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
.ed-row.two { grid-template-columns:1fr 1fr; }
label { display:grid; gap:2px; font-size:11px; color:var(--muted); }
input, select { font:inherit; font-size:13px; color:var(--ink); background:var(--field); border:1px solid var(--line); border-radius:6px; padding:5px 6px; width:100%; min-width:0; }
input[type=color] { padding:1px; height:30px; }
button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:7px 12px; cursor:pointer; }
button:hover { border-color:var(--ink); }
button.ed-primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
button.ed-small { padding:3px 8px; font-size:12px; }
.ed-status { color:var(--muted); font-size:13px; }
details summary { cursor:pointer; color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin:18px 0 8px; }
@media (max-width:900px) { .ed-app { grid-template-columns:1fr; } .ed-panel { border-left:0; border-top:1px solid var(--line); max-height:none; } }
</style>
</head>
<body>
<div class="ed-app">
  <main class="ed-stage">
    <div class="ed-bar">
      <button id="play" class="ed-primary">▶ Play</button>
      <button id="theme">Dark</button>
      <button id="reroll" title="New random drop, same layout">🎲 New drop</button>
      <span class="ed-spacer"></span>
      <span id="status" class="ed-status"></span>
      <button id="save" class="ed-primary">Save</button>
    </div>
    <div id="canvas" class="ed-canvas"></div>
    <p class="ed-hint">Drag the greeting, name, subtitle or any square to move it. Save writes <code>banner.config.json</code> and both SVGs in <code>assets/</code>.</p>
  </main>
  <aside id="panel" class="ed-panel"></aside>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
